services:
  - type: web
    name: kalaverse
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TRUST_PROXY
        value: 1
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-31b-it:free,nvidia/nemotron-3-super-120b-a12b:free,openrouter/free
